<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizon Graphic Studio | Ultra-Premium Design Agency Varanasi</title>
    <meta name="description" content="Horizon Graphic Studio — Varanasi's premier multi-disciplinary graphic design agency specializing in brand identity systems, luxury packaging, 3D CGI, and digital flagships. A Smart Vista IT Solutions Company.">
    <meta name="author" content="Horizon Graphic Studio (Smart Vista IT Solutions)" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#070d18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Horizon Studio" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Horizon Graphic Studio" />
    <meta name="msapplication-TileColor" content="#070d18" />
    <meta name="msapplication-TileImage" content="/icon-192x192.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512x512.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Horizon Graphic Studio | Ultra-Premium Design Agency Varanasi">
    <meta property="og:description" content="Varanasi's premier graphic design agency specializing in brand identity systems, luxury packaging, 3D CGI, and digital flagships.">
    <meta property="og:image" content="/icon-512x512.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Horizon Graphic Studio | Premium Design Agency Varanasi">
    <meta name="twitter:description" content="Horizon Graphic Studio — Varanasi's premier graphic design agency specializing in branding, web design, print, packaging, and brand videos.">
    <meta name="twitter:image" content="/icon-512x512.png">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('[Horizon PWA] Service Worker registered:', registration.scope);
            })
            .catch((error) => {
              console.log('[Horizon PWA] SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
